	<form>

		<h3 class="text-center mb-3">Registration</h3>

		<label>First Name</label>
		<input type="text" name="firstname" class="form-control mb-2" required>

		<label>Last Name</label>
		<input type="text" name="lastname" class="form-control mb-2" required>

		<label>User Name</label>
		<input type="text" name="username" placeholder="Enter username" class="form-control mb-2" required>

		<label>Password</label>
		<input type="password" name="password" placeholder="Enter Password" class="form-control mb-2" required>

		<label>Phone Number</label>
		<input type="tel" name="phone" id="contactNumber" class="form-control mb-2" maxlength="10"
			placeholder="Enter Contact Number" pattern="[0-9]{10}" required>

		<label>Email</label>
		<input type="email" name="email" class="form-control mb-3" placeholder="Enter Email"
			pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" required>

		<button type="submit" class="btn btn-primary w-100">
			Registration
		</button>

		<a href="loginpage.html" class="btn btn-primary w-100 mt-2">
			Login
		</a>

	</form>

	<script>

		document.querySelector("form")
			.addEventListener("submit", async function (e) {

				e.preventDefault();

				const data = {

					firstname: document.querySelector("[name='firstname']").value,

					lastname: document.querySelector("[name='lastname']").value,

					username: document.querySelector("[name='username']").value,

					password: document.querySelector("[name='password']").value,

					phone: document.querySelector("[name='phone']").value,

					email: document.querySelector("[name='email']").value
				};

				const response = await fetch("http://localhost:2121/users/register", {

					method: "POST",

					headers: {
						"Content-Type": "application/json"
					},

					body: JSON.stringify(data)

				});

				const result = await response.text();

				alert(result);

				if (result === "Registration Successful") {

					window.location.href = "loginpage.html";
				}

			});

	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
