<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team Leave</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    background-color: #f5f6fa;
    padding: 25px;
    font-family: 'Segoe UI', sans-serif;
}

.mat-card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.SubHead {
    font-size: 22px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
}

.spgeBack {
    font-size: 14px;
    cursor: pointer;
    color: #555;
}

.spgeBack:hover {
    color: #3f51b5;
}

table {
    width: 100%;
    margin-top: 15px;
}

th {
    background: #fafafa;
    padding: 14px;
    border-bottom: 2px solid #eee;
    font-size: 14px;
    white-space: nowrap;
}

td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    vertical-align: middle;
}

.no-data {
    text-align: center;
    padding: 30px;
    color: #777;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="mat-card">

    <h4 class="SubHead">
        My Team Leave
        <a href="Homepage.html">
            <span class="spgeBack">
                <i class="fa-solid fa-angles-left pe-1"></i> Back
            </span>
        </a>
    </h4>

    <div class="table-responsive">

        <table class="table">

            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Leave Type</th>
                    <th>From Date</th>
                    <th>To Date</th>
                    <th>Session</th>
                    <th>No. of Days</th>
                    <th>Reason</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td colspan="8" class="no-data">
                        No data found...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
