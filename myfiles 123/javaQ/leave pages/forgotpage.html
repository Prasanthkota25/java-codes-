<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 shadow" style="max-width:400px;margin:auto;">

<h3 class="text-center">Reset Password</h3>

<form id="forgotForm">

<input class="form-control mt-2" id="username" placeholder="Username" required>
<input class="form-control mt-2" id="newpass" type="password" placeholder="New Password" required>
<input class="form-control mt-2" id="confirmpass" type="password" placeholder="Confirm Password" required>

<button class="btn btn-warning w-100 mt-3">Reset</button>

<a href="login.html" class="btn btn-link w-100">Back to Login</a>

</form>
</div>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(e){
    e.preventDefault();

    if(newpass.value !== confirmpass.value){
        alert("Passwords not matching");
        return;
    }

    let data = {
        username: username.value,
        password: newpass.value
    };

    fetch("http://localhost:9999/users/forgot", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        if(msg === "Password Updated"){
            window.location.href="login.html";
        }
    });
});
</script>

</body>
</html>
