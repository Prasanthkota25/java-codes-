<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
  *{
        margin: 0;
        padding: 0;
    }
        body {
            background-color: darkorange;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

.menu {
    display: inline-block;
    width: 75%;
    margin-top: 50px;
    margin-left: -30px;
    float: left;
}
nav {
            background-color: #fff;
            padding: 10px;
            text-align: left;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
           
        }

.container{
    max-width:600px;
    margin:auto;
    margin-top: 60px;
    background:#fff;
    padding:20px;border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h2{
    text-align:center;
    color:darkorange;
}
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    border-bottom:1px solid #eee;
    padding-bottom:5px;
}
.name{
    flex:1;
}

.qty{
    display:flex;
    align-items:center;
    gap:5px;
}
.qty button{
    border:none;
    background:#eee;
    padding:4px 8px;
    border-radius:4px;
    cursor:pointer;
}
.qty input{
    width:40px;
    text-align:center;
}
.remove{
    background:none;
    border:none;
    color:red;
    cursor:pointer;
}
.bill-line{
    display:flex;
    justify-content:space-between
    ;margin:5px 0;
}
.total{
    font-weight:bold;
    border-top:1px solid #ccc;
    padding-top:5px;
}
.btn{background:darkorange;
    color:white;
    border:none;
    width:100%;
    padding:10px;
    border-radius:5px;
    margin-top:10px;
}
.btn:hover{
    background:#ff8c00;
    }
    .btn {
          cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛒 Your Cart</h2>
        <div id="cartItems"></div>
        <hr>
        <div id="bill"></div>
        <button class="btn" onclick="checkout()">Checkout</button>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    

      <script>

let cart = JSON.parse(localStorage.getItem("cartData")) || [];
const GST = 0.05, TAX = 0.05;

function saveCart() {
  localStorage.setItem("cartData", JSON.stringify(cart));
}

function renderCart() {
  const cartDiv = document.getElementById("cartItems");
  cartDiv.innerHTML = "";
  let subtotal = 0;

  if (cart.length === 0) {
    cartDiv.innerHTML = "<p>Your cart is empty 🛒</p>";
    document.getElementById("bill").innerHTML = "";
    return;
  }

  cart.forEach((item, index) => {
    const total = item.price * item.qty;
    subtotal += total;
    cartDiv.innerHTML += `
      <div class='item'>
        <div class='name'>${item.name}<br><small>₹${item.price} each</small></div>
        <div class='qty'>
          <button onclick='updateQty(${index}, -1)'>-</button>
          <input type='number' value='${item.qty}' min='1' onchange='setQty(${index}, this.value)'>
          <button onclick='updateQty(${index}, 1)'>+</button>
        </div>
        <div>₹${total}</div>
        <button class='remove' onclick='removeItem(${index})'>✖</button>
      </div>`;
  });

  let gst = subtotal * GST;
  let tax = subtotal * TAX;
  let totalBill = subtotal + gst + tax;

  document.getElementById("bill").innerHTML = `
    <div class='bill-line'><span>Subtotal:</span><span>₹${subtotal.toFixed(2)}</span></div>
    <div class='bill-line'><span>GST (5%):</span><span>₹${gst.toFixed(2)}</span></div>
    <div class='bill-line'><span>Other Tax (5%):</span><span>₹${tax.toFixed(2)}</span></div>
    <div class='bill-line total'><span>Total Bill:</span><span>₹${totalBill.toFixed(2)}</span></div>
  `;
}

function updateQty(i, change) {
  cart[i].qty = Math.max(1, cart[i].qty + change);
  saveCart();
  renderCart();
}

function setQty(i, val) {
  cart[i].qty = Math.max(1, Number(val));
  saveCart();
  renderCart();
}

function removeItem(i) {
  if (confirm("Remove this item?")) {
    cart.splice(i, 1);
    saveCart();
    renderCart();
  }
}

function checkout() {
  let total = document.querySelector(".total span:last-child").innerText;
  alert("Thank you! Your total bill is " + total);
  localStorage.removeItem("cartData");
  cart = [];
  renderCart();
}

renderCart();

</script>
</body>
</html>
