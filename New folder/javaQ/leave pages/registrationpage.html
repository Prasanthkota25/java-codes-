<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 shadow" style="max-width:500px;margin:auto;">

<h3 class="text-center">Registration</h3>

<form id="registerForm">

<input class="form-control mt-2" id="firstname" placeholder="First Name" required>
<input class="form-control mt-2" id="lastname" placeholder="Last Name" required>
<input class="form-control mt-2" id="username" placeholder="Username" required>
<input class="form-control mt-2" id="password" type="password" placeholder="Password" required>
<input class="form-control mt-2" id="cpassword" type="password" placeholder="Confirm Password" required>
<input class="form-control mt-2" id="phone" placeholder="Phone" required>
<input class="form-control mt-2" id="gmailid" placeholder="Gmail" required>

<button class="btn btn-primary w-100 mt-3">Register</button>

<a href="login.html" class="btn btn-link w-100">Login</a>

</form>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    let pass = password.value;
    let cpass = cpassword.value;

    if(pass !== cpass){
        alert("Passwords not matching");
        return;
    }

    let data = {
        firstname: firstname.value,
        lastname: lastname.value,
        username: username.value,
        password: pass,
        phonenumber: phone.value,
        gmailid: gmailid.value
    };

    fetch("http://localhost:9999/users", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(() => {
        alert("Registered Successfully");
        window.location.href="login.html";
    });
});
</script>

</body>
</html>
