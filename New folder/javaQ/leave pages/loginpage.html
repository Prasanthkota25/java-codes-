<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 shadow" style="max-width:400px;margin:auto;">

<h3 class="text-center">Login</h3>

<form id="loginForm">

<input class="form-control mt-2" id="username" placeholder="Username" required>
<input class="form-control mt-2" id="password" type="password" placeholder="Password" required>

<button class="btn btn-success w-100 mt-3">Login</button>

<a href="forgot.html" class="btn btn-link w-100">Forgot Password?</a>
<a href="register.html" class="btn btn-link w-100">Create Account</a>

</form>
</div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    let data = {
        username: username.value,
        password: password.value
    };

    fetch("http://localhost:9999/users/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        if(msg === "Login Success"){
            window.location.href="home.html";
        }
    });
});
</script>

</body>
</html>
