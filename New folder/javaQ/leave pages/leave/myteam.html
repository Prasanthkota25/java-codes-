<!DOCTYPE html>

<html lang="en">



<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Team Leave</title>



<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



<style>

body {

    background-color: #f5f6fa;

    padding: 25px;

    font-family: 'Segoe UI', sans-serif;

}



.mat-card {

    background: white;

    padding: 25px;

    border-radius: 10px;

    box-shadow: 0 2px 12px rgba(0,0,0,0.08);

}



.SubHead {

    font-size: 22px;

    font-weight: 600;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

    border-bottom: 1px solid #eee;

    padding-bottom: 15px;

}



.spgeBack {

    font-size: 14px;

    cursor: pointer;

    color: #555;

}



.spgeBack:hover {

    color: #3f51b5;

}



.tableListViewHeader {

    display: flex;

    justify-content: space-between;

    flex-wrap: wrap;

    gap: 15px;

    margin-bottom: 20px;

}



select, input {

    padding: 8px 12px;

    border: 1px solid #ddd;

    border-radius: 5px;

}



.tableAction-button {

    border: none;

    border-radius: 5px;

    width: 38px;

    height: 38px;

    color: white;

}



.search-btn { background: #3f51b5; }

.excel-btn { background: #28a745; }



table {

    width: 100%;

    margin-top: 15px;

}



th {

    background: #fafafa;

    padding: 14px;

    border-bottom: 2px solid #eee;

    font-size: 14px;

    white-space: nowrap;

}



td {

    padding: 14px;

    border-bottom: 1px solid #eee;

    font-size: 14px;

    vertical-align: middle;

}



.text-break {

    max-width: 220px;

    word-break: break-word;

}

</style>

</head>



<body>



<div class="mat-card">



    <h4 class="SubHead">

        My Team Leave

        <a href="Homepage.html">

            <span class="spgeBack">

                <i class="fa-solid fa-angles-left pe-1"></i> Back

            </span>

        </a>

    </h4>



    <!-- TABLE -->

    <div class="table-responsive">



        <table class="table">

            <thead>

                <tr>

                    <th>Employee Name</th>

                    <th>Leave Type</th>

                    <th>From Date</th>

                    <th>To Date</th>

                    <th>Session</th>

                    <th>No. of Days</th>

                    <th>Reason</th>

                    <th>Status</th>

                </tr>

            </thead>



            <tbody id="teamLeaveBody">

                <tr>

                    <td colspan="8" class="text-center text-muted py-4">

                        No data found...

                    </td>

                </tr>

            </tbody>



        </table>



    </div>

</div>



<script>



// LOAD SAME DATA FROM APPLY LEAVE PAGE

function loadTeamLeave() {



    const history =

        JSON.parse(localStorage.getItem("leaveHistory")) || [];



    const table =

        document.getElementById("teamLeaveBody");



    table.innerHTML = "";



    if (history.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="8" class="text-center text-muted py-4">

                    No data found...

                </td>

            </tr>

        `;

        return;

    }



    history.forEach(item => {



        const row = document.createElement("tr");



        row.innerHTML = `

            <td>${item.employeeName}</td>

            <td>${item.leaveType}</td>

            <td>${item.fromDate}</td>

            <td>${item.toDate}</td>

            <td>${item.sessionDisplay}</td>

            <td>${item.noOfDays}</td>

            <td class="text-break">${item.reason}</td>

            <td>${item.status}</td>

        `;



        table.appendChild(row);

    });

}



// LOAD ON PAGE OPEN

window.onload = loadTeamLeave;



</script>



</body>

</html>
