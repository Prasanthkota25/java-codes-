<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --navbar-color: #f8f9fa;
    --card-color: #ffffff;   
}

[data-theme="dark"] {
    --bg-color: #121212;
    --text-color: #ffffff;
    --navbar-color: #1f1f1f;
    --card-color: #1e1e1e;   
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
}

.navbar {
    background-color: var(--navbar-color) !important;
}

/* PAGE HEADER */
.page-header {
    font-size: 22px;
    font-weight: bold;
    padding: 15px 20px 0 20px;
}

/* LAYOUT */
.layout {
    display: flex;
    gap: 20px;
    padding: 20px;
}

/* LEFT */
.left-section {
    width: 25%;
    background: var(--card-color);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ICON */
.profile-icon {
    font-size: 60px;
    margin-top: 20px;
}

/* RIGHT */
.right-section {
    width: 75%;
    background: var(--card-color);
    padding: 20px;
    border-radius: 10px;
}




    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: #222;
      color: white;
      padding: 5px;
    }
</style>
</head>

<body>

<!-- NAVBAR (clean structure, no UI change) -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="HomePage.html">Infinite</a>

        <div class="ms-auto d-flex align-items-center gap-3">

            <!-- THEME -->
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                    Theme
                </button>
                <ul class="dropdown-menu">
                    <li><button class="dropdown-item" onclick="setTheme('light')">Light</button></li>
                    <li><button class="dropdown-item" onclick="setTheme('dark')">Dark</button></li>
                </ul>
            </div>

            <!-- ACCOUNT -->
            <div class="dropdown">
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                    👤 <span id="usernameDisplay">Account</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                    <li><a class="dropdown-item" href="loginpage.html">Logout</a></li>
                </ul>
            </div>

        </div>
    </div>
</nav>

<!-- HEADER -->
<div class="page-header">
    Employee Profile
</div>

<div class="layout">

<!-- LEFT -->
<div class="left-section">
    <div class="profile-icon">👤</div>
    <div class="emp-name">Loading...</div>
</div>

<!-- RIGHT -->
<div class="right-section">

<div class="row g-3">

    <div class="col-md-4">
        <label>Employee No</label>
        <input id="empId" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Full Name</label>
        <input id="fullName" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Email</label>
        <input id="email" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Username</label>
        <input id="username" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Phone</label>
        <input id="phone" class="form-control">
    </div>

    <div class="col-md-4">
        <label>BU</label>
        <input id="bu" class="form-control">
    </div>

    <div class="col-md-4">
        <label>SBU</label>
        <input id="sbu" class="form-control">
    </div>

    <div class="col-md-4">
        <label>BU Head</label>
        <input id="buHead" class="form-control">
    </div>

    <div class="col-md-4">
        <label>SBU Head</label>
        <input id="sbuHead" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Reporting Manager</label>
        <input id="manager" class="form-control">    
    </div>

    <div class="col-md-4">
        <label>Extension</label>
        <input id="extension" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Location</label>
        <input id="location" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Designation</label>
        <input id="designation" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Status</label>
        <input id="status" class="form-control">
    </div>

    <div class="col-md-4">
        <label>Cubical No</label>
        <input id="cubical" class="form-control">
    </div>

</div>

</div>

</div>

<!-- SCRIPT -->
<script>

function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
}

window.onload = () => {
    const saved = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
};

window.addEventListener("DOMContentLoaded", async () => {

    const username = localStorage.getItem("username");

    if (!username) {
        alert("Login required");
        window.location.href = "loginpage.html";
        return;
    }

    try {
        const res = await fetch(`http://localhost:2121/users/username/${username}`);
        const user = await res.json();

        document.querySelector(".emp-name").innerText =
            user.firstname + " " + user.lastname;

        document.getElementById("usernameDisplay").innerText = user.username;

        document.getElementById("empId").value = user.id || "";
        document.getElementById("fullName").value = user.firstname + " " + user.lastname;
        document.getElementById("email").value = user.email || "";
        document.getElementById("username").value = user.username || "";
        document.getElementById("phone").value = user.phone || "";

        document.getElementById("bu").value = user.bu || "";
        document.getElementById("sbu").value = user.sbu || "";
        document.getElementById("buHead").value = user.buHead || "";
        document.getElementById("sbuHead").value = user.sbuHead || "";
        document.getElementById("manager").value = user.manager || "";
        document.getElementById("extension").value = user.extension || "";
        document.getElementById("location").value = user.location || "";
        document.getElementById("designation").value = user.designation || "";
        document.getElementById("status").value = user.status || "";
        document.getElementById("cubical").value = user.cubical || "";

    } catch (err) {
        console.error(err);
        alert("Error loading data");
    }
});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



 <footer>
    Infinite Computer
  </footer>
</body>
</html>
