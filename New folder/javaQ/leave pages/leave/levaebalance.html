}

.table tbody td:first-child {

</head>

<body>

            </tr>
        </thead>

        <tbody id="balanceTable"></tbody>

    </table>

</div>

<script>

const defaultBalances = {
    privilege: 10,
    sick: 5
};

let currentUser = null;

/* =========================
   STORAGE KEYS
========================= */

function balanceKey(user) {
    return `leave_balances_${user}`;
}

function historyKey(user) {
    return `leave_history_${user}`;
}

/* =========================
   LOAD USER
========================= */

async function loadUser() {

    const username = localStorage.getItem("username");

    if (!username) {
        alert("Login required");
        window.location.href = "loginpage.html";
        return;
    }

    try {

        const res = await fetch(
            `http://localhost:2121/users/username/${username}`
        );

        const user = await res.json();

        currentUser = user;

        calculateSummary();

    } catch (err) {

        console.error(err);
        alert("Failed to load user");

    }
}

/* =========================
   GET BALANCES
========================= */

function getBalances() {

    if (!currentUser)
        return structuredClone(defaultBalances);

    const stored = localStorage.getItem(
        balanceKey(currentUser.username)
    );

    return stored
        ? JSON.parse(stored)
        : structuredClone(defaultBalances);
}

/* =========================
   GET HISTORY
========================= */

function getHistory() {

    if (!currentUser) return [];

    return JSON.parse(
        localStorage.getItem(
            historyKey(currentUser.username)
        )
    ) || [];
}

/* =========================
   CALCULATE SUMMARY
========================= */

function calculateSummary() {

    const selectedYear = parseInt(
        document.getElementById("yearSelect").value
    );

    const balances = getBalances();
    const history = getHistory();

    let applied = {
        privilege: 0,
        sick: 0
    };

    let approved = {
        privilege: 0,
        sick: 0
    };

    let cancelled = {
        privilege: 0,
        sick: 0
    };

    history.forEach(item => {

        const itemYear = item.fromDate
            ? new Date(item.fromDate).getFullYear()
            : null;

        if (selectedYear && itemYear !== selectedYear)
            return;

        /* =====================
           PRIVILEGE
        ===================== */

        if (item.leaveType === "Privilege") {

            applied.privilege++;

            if (item.status === "Approved") {
                approved.privilege++;
            }

            else if (item.status === "Cancelled") {
                cancelled.privilege++;
            }
        }

        /* =====================
           SICK
        ===================== */

        else if (item.leaveType === "Sick") {

            applied.sick++;

            if (item.status === "Approved") {
                approved.sick++;
            }

            else if (item.status === "Cancelled") {
                cancelled.sick++;
            }
        }

    });

    renderTable(
        balances,
        applied,
        approved,
        cancelled
    );
}

/* =========================
   RENDER TABLE
========================= */

function renderTable(
    balances,
    applied,
    approved,
    cancelled
) {

    document.getElementById("balanceTable").innerHTML = `

        <tr>
            <td>Privilege Leave</td>
            <td>10</td>
            <td>0</td>
            <td>${applied.privilege}</td>
            <td>${approved.privilege}</td>
            <td>${cancelled.privilege}</td>
            <td>${balances.privilege}</td>
        </tr>

        <tr>
            <td>Sick Leave</td>
            <td>5</td>
            <td>0</td>
            <td>${applied.sick}</td>
            <td>${approved.sick}</td>
            <td>${cancelled.sick}</td>
            <td>${balances.sick}</td>
        </tr>

    `;
}

/* =========================
   PAGE LOAD
========================= */

window.onload = async function () {

    await loadUser();

};

</script>
</body>
</html>
