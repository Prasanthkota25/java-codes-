	<style>
		:root {
			--bg-color: #f8f9fa;
			--text-color: #000;
			--card-bg: #ffffff;
			--navbar-color: #ffffff;
			--table-header: #0d6efd;
			--footer-bg: #222;
			--border-color: rgba(0, 0, 0, 0.1);
		}

		[data-theme="dark"] {
			--bg-color: #121212;
			--text-color: #ffffff;
			--card-bg: #1e1e1e;
			--navbar-color: #1f1f1f;
			--table-header: #0d6efd;
			--footer-bg: #000;
			--border-color: rgba(255, 255, 255, 0.15);
		}


		body {
			background-color: var(--bg-color);
			color: var(--text-color);
			font-family: Arial, sans-serif;
			margin: 0;
		}



		.navbar {
			background-color: var(--navbar-color) !important;
			border-bottom: 1px solid var(--border-color);
		}


		.navbar .nav-link {
			color: var(--text-color) !important;
		}

		.navbar .nav-link.active {
			font-weight: 600;
		}




		.container {
			margin-top: 30px;
			margin-bottom: 70px;
			background: var(--card-bg);
			padding: 25px;
			border-radius: 10px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
		}


		table {
			width: 100%;
			margin-top: 20px;
			border-collapse: collapse;
			background: var(--card-bg);
		}

		table thead {
			background-color: var(--table-header);
			color: #fff;
		}

		table th,
		table td {
			padding: 12px;
			text-align: center;
			border: 1px solid var(--border-color);
			font-size: 14px;
		}

		table tbody tr:hover {
			background-color: rgba(0, 123, 255, 0.05);
		}


		.dropdown-menu {
			background-color: var(--card-bg);
			color: var(--text-color);
			border: 1px solid var(--border-color);
		}

		.dropdown-item {
			color: var(--text-color);
		}

		.dropdown-item:hover {
			background-color: rgba(0, 123, 255, 0.1);
		}


		footer {
			position: fixed;
			bottom: 0;
			width: 100%;
			background-color: var(--footer-bg);
			color: #fff;
			text-align: center;
			padding: 10px 0;
			font-size: 14px;
		}


		#options {
			display: none;
			margin: 10px 40px;
			padding: 15px;
			width: 220px;
			background-color: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 10px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
		}

		#options button {
			width: 100%;
			padding: 10px;
			margin: 5px 0;
			border: none;
			border-radius: 6px;
			background-color: #0d6efd;
			color: white;
		}

		#options button:hover {
			background-color: #084298;
		}


		.nav-underline .nav-link {
			padding-right: 20px;
			padding-left: 15px;
		}
	</style>
</head>

<body>



	<div class="container">
		<h2>My Team Leave</h2>

		<table>
			<thead>
				<tr>
					<th>Employee No.</th>
					<th>Employee Name</th>
					<th>Applied On</th>
					<th>Leave Type</th>
					<th>Comp-Off Date</th>
					<th>From Date</th>
					<th>To Date</th>
					<th>No. of Days</th>
					<th>Status</th>
					<th>Request Type</th>
					<th>Contact Number</th>
					<th>Reason</th>
					<th>Approver Remarks</th>
					<th>Action</th>
				</tr>
			</thead>

			<tbody id="tableBody">
				<tr>
					<td colspan="14">No records found</td>
				</tr>
			</tbody>
		</table>
	</div>

	<footer>
		Infinite Computer
	</footer>

	<script>
		function setTheme(theme) {
			document.documentElement.setAttribute("data-theme", theme);
			localStorage.setItem("theme", theme);
		}

		window.onload = function () {
			const savedTheme = localStorage.getItem("theme");
			if (savedTheme) {
				document.documentElement.setAttribute("data-theme", savedTheme);
			}
		};
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
